name: example

# End-to-end usage example (macOS -- the verified path). Downloads a real,
# small, publicly-distributed notarized macOS app as a demo target; any
# legitimate installer URL works the same way.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve a demo download URL
        id: demo
        run: |
          url=$(curl -fsSL -H "User-Agent: gha-runner-gui-kit (+https://github.com/qte77/gha-runner-gui-kit)" \
            https://yappy.biz/api/v1/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['download_url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: ./
        with:
          download-url: ${{ steps.demo.outputs.url }}
          install-type: dmg
          settle-seconds: '5'
