name: example-installer-path

# Verification run for the `installer-path` input (an alternative to
# `download-url` for a file already on the runner -- e.g. one this same
# job just built and signed, per the TRMNLY integration this was added
# for). Curls the same Yappy DMG example.yml uses, but into a local file
# first, then passes that local path instead of a URL, to prove the new
# code path in scripts/macos.sh actually works end-to-end. Delete this
# file once verified -- it's a one-shot proof, not a permanent example
# (example.yml already documents the more common download-url path).

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Simulate a same-job build by downloading the DMG locally first
        run: |
          url=$(curl -fsSL -H "User-Agent: gha-runner-gui-kit (+https://github.com/qte77/gha-runner-gui-kit)" \
            https://yappy.biz/api/v1/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['download_url'])")
          curl -fsSL -o /tmp/prebuilt.dmg "$url"

      - uses: ./
        with:
          installer-path: /tmp/prebuilt.dmg
          install-type: dmg
          settle-seconds: '5'
