name: yappy-google-login-probe

# Phase B, step 1: click "Sign in with Google". example.yml's run showed
# Yappy's real first-launch screen is a mandatory Google sign-in gate
# (contradicts yappy.biz's own docs, which claim no account is needed --
# direct observation wins).
#
# CONFIRMED WORKING: the click itself. The button has no accessible name
# (empty AXTitle) -- System Events sees it only as `button 1 of window 1`,
# a direct sibling of the heading/subtitle text, not nested under the
# icon's group/scroll-area. `click button "Sign in with Google" of window 1`
# fails (-1728, no such object); `click button 1 of window 1` works.
# Accessibility permission for UI scripting is NOT an issue on macos-14
# runners -- a permissions failure gives a distinct "not allowed assistive
# access" error, and that never appeared.
#
# NOT AUTOMATABLE past the click, on GitHub-hosted macOS runners
# specifically (11 dispatches total; CLOSED, see README's "Case study:
# Yappy" section). Yappy uses an embedded WebKit view for the Google auth
# flow -- com.apple.WebKit.Networking plus two com.apple.WebKit.WebContent
# processes spin up on click -- rather than the system browser. Yappy's
# own unified log shows both resulting webviews finish loading
# successfully (no WebKit error, no safeBrowsingWarning) then go invisible
# ~6-7s later, with nothing logged as an error/denial anywhere. A tight
# poll (every 0.2s for 6s, right after the click, ready to
# reposition+screenshot the instant a window appeared) never found a
# window at all -- ruling out "it exists but hides too fast to catch". No
# crash report exists for Yappy. The system's broader unified log around
# that window shows RunningBoard process-role messages -- WindowServer in
# role `Background`, WindowManager.agent in role `UserInteractiveFocal`.
# External research (WebKit's own ProcessThrottler behavior) indicates
# that role follows FROM the hosting view never becoming visible, rather
# than being an independent cause -- so it's a symptom, not the root
# mechanism, but the underlying "why doesn't the window become visible"
# is still unanswered. Tried and made no difference: disabling App Nap
# (`defaults write NSGlobalDomain NSAppSleepDisabled -bool YES`) before
# launch, and relaunching via `launchctl asuser $(id -u) open -a ...`
# instead of plain `open` (in case the launch context affected RunningBoard
# promotion) -- both still produced `windowFound=false`. Network
# reachability is fine (curl to accounts.google.com returns 302), so this
# isn't egress/DNS, and Accessibility permission is confirmed fine.
#
# Conclusion: not solvable from inside a GitHub-hosted ephemeral macOS
# runner via any script-side change attempted so far. If Google login
# needs to happen for real, the options are (a) a self-hosted runner on a
# real, normally-logged-in Mac, where a human signs in once and the
# session persists across runs, or (b) sign in manually elsewhere, capture
# whatever Yappy persists after a successful login (contents unknown until
# observed -- likely something under ~/.yappy/ and/or Keychain), and
# restore that into each ephemeral run as a secret. Neither attempted --
# this repo has no macOS hardware outside GitHub-hosted runners to build
# or verify either against. No credentials have been typed anywhere in
# this process. Also worth doing regardless of CI: report this to Yappy's
# developer.
#
# Second research pass found closer prior art than the initial
# ASWebAuthenticationSession forum threads: Google's actual
# embedded-webview rejection is NOT silent -- it serves a visible "this
# user-agent is not permitted" error page
# (https://cnr.sh/posts/2021-10-11-google-oauth-wkwebview/), which argues
# against Google-side blocking as the explanation here, since a rejection
# would still require the window to become visible to show it. Closer
# matches: Auth0 and Jamf community threads describe native macOS
# WKWebView-hosted login windows that "never appear" at all, no error, on
# real non-CI Macs too
# (https://community.auth0.com/t/the-login-window-in-a-wkwebview-on-macos-is-sometimes-broken/41048,
# https://community.jamf.com/general-discussions-2/wkwebview-native-macos-connector-30405)
# -- switching to Safari is the cited workaround in similar cases, but
# neither thread identifies a root cause. Reinforces "likely a
# Yappy/WebKit-side bug, not CI-specific" over either original hypothesis.
#
# Separately: `macos-14` runner images deprecate 2026-11-02
# (actions/runner-images#13518). A retest on `macos-26` was attempted
# (branch chore/bump-macos-26) but is MOOT, not just inconclusive: that
# runner image has its own unrelated, unfixable regression where a second
# `screencapture` call in a job triggers an unclickable system consent
# dialog (see README's "macos-26 is currently unusable..." section) --
# there is no way to even get a valid screenshot to check this workflow's
# actual behavior on macos-26 right now. Staying on `macos-14` for both
# reasons (this closure, and the screencapture regression) until one of
# them changes.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest Yappy DMG URL
        id: yappy
        run: |
          url=$(curl -fsSL -H "User-Agent: gha-runner-gui-kit (+https://github.com/qte77/gha-runner-gui-kit)" \
            https://yappy.biz/api/v1/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['download_url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: ./
        with:
          download-url: ${{ steps.yappy.outputs.url }}
          install-type: dmg
          settle-seconds: '8'
          interact-script: |
            tell application "Yappy" to activate
            delay 1
            tell application "System Events"
              tell process "Yappy"
                click button 1 of window 1
              end tell
            end tell
            delay 9
