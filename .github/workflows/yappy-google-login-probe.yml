name: yappy-google-login-probe

# Phase B, step 1: click "Sign in with Google". example.yml's run showed
# Yappy's real first-launch screen is a mandatory Google sign-in gate
# (contradicts yappy.biz's own docs, which claim no account is needed --
# direct observation wins).
#
# CONFIRMED WORKING: the click itself. The button has no accessible name
# (empty AXTitle) -- System Events sees it only as `button 1 of window 1`,
# a direct sibling of the heading/subtitle text, not nested under the
# icon's group/scroll-area. `click button "Sign in with Google" of window 1`
# fails (-1728, no such object); `click button 1 of window 1` works.
# Accessibility permission for UI scripting is NOT an issue on macos-14
# runners -- a permissions failure gives a distinct "not allowed assistive
# access" error, and that never appeared.
#
# BLOCKED past the click, with real evidence now (8 dispatches total):
# Yappy uses an embedded WebKit view for the Google auth flow --
# com.apple.WebKit.Networking plus two com.apple.WebKit.WebContent
# processes spin up on click, confirmed via a full process list -- rather
# than the system browser. Yappy's own unified log (`log show --predicate
# 'process == "Yappy"'`) shows BOTH resulting webviews (two concurrent
# WebPageProxy instances, distinct webPageIDs) successfully finish loading
# (`didFinishLoadForFrame`, no WebKit-level error, safeBrowsingWarning=0)
# -- then, ~6-7s later, both views' visibility flips 1 -> 0 (hidden).
# Nothing in Yappy's own logging names an error, denial, or rejection
# anywhere in that window. Across every check run (delays from 0.4s to
# ~9s post-click, an `entire contents`/`every window`/`every menu bar
# item of menu bar 2` query of process "Yappy", and an all-process
# `windows of p` sweep), no visible window or menu-bar status item is
# ever observed, and no screenshot ever shows anything but the desktop.
# Network reachability is fine (curl to accounts.google.com from the
# runner returns 302), so this isn't egress/DNS.
#
# Two hypotheses going in; the log evidence now leans toward #2, though
# neither is proven:
#  1. Google's OAuth blocks sign-in from embedded (non-system-browser)
#     webviews as an anti-phishing measure ("disallowed_useragent"). Less
#     likely given the log shows two successful page loads with no error
#     signal -- a rejection page is still a page Google would have to
#     serve and WebKit would still report loading successfully, so this
#     isn't ruled out, but nothing positively supports it either.
#  2. The WebKit-hosted view's window fails to actually composite/display
#     in this runner's WindowServer session even though it loads and its
#     internal visibility state briefly reads "visible", while plain
#     AppKit windows (the initial welcome screen) render and screenshot
#     fine. The load-succeeds-then-goes-invisible pattern fits this better
#     than an explicit rejection.
# Distinguishing these further would need seeing the actual rendered
# content (not attempted: forcing the WKWebView's window to a known
# on-screen frame/level before it can hide, or extracting the loaded
# page's URL/title via the accessibility tree while `didFinishLoadForFrame`
# is firing) -- not done. Stopped here; no credentials have been typed
# anywhere in this process.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest Yappy DMG URL
        id: yappy
        run: |
          url=$(curl -fsSL -H "User-Agent: gha-runner-gui-kit (+https://github.com/qte77/gha-runner-gui-kit)" \
            https://yappy.biz/api/v1/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['download_url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: ./
        with:
          download-url: ${{ steps.yappy.outputs.url }}
          install-type: dmg
          settle-seconds: '8'
          interact-script: |
            tell application "Yappy" to activate
            delay 1
            tell application "System Events"
              tell process "Yappy"
                click button 1 of window 1
              end tell
            end tell
            delay 9
