name: yappy-google-login-probe

# Phase B, step 1: click "Sign in with Google". example.yml's run showed
# Yappy's real first-launch screen is a mandatory Google sign-in gate
# (contradicts yappy.biz's own docs, which claim no account is needed --
# direct observation wins).
#
# CONFIRMED WORKING: the click itself. The button has no accessible name
# (empty AXTitle) -- System Events sees it only as `button 1 of window 1`,
# a direct sibling of the heading/subtitle text, not nested under the
# icon's group/scroll-area. `click button "Sign in with Google" of window 1`
# fails (-1728, no such object); `click button 1 of window 1` works.
# Accessibility permission for UI scripting is NOT an issue on macos-14
# runners -- a permissions failure gives a distinct "not allowed assistive
# access" error, and that never appeared.
#
# LIKELY NOT AUTOMATABLE past the click, on GitHub-hosted macOS runners
# specifically (10 dispatches total). Yappy uses an embedded WebKit view
# for the Google auth flow -- com.apple.WebKit.Networking plus two
# com.apple.WebKit.WebContent processes spin up on click -- rather than
# the system browser. Yappy's own unified log shows both resulting
# webviews finish loading successfully (no WebKit error, no
# safeBrowsingWarning) then go invisible ~6-7s later, with nothing logged
# as an error/denial anywhere. A tight poll (every 0.2s for 6s, right
# after the click, ready to reposition+screenshot the instant a window
# appeared) never found a window at all -- ruling out "it exists but
# hides too fast to catch". No crash report exists for Yappy. The
# system's broader unified log around that window shows RunningBoard
# process-role messages -- WindowServer in role `Background`,
# WindowManager.agent in role `UserInteractiveFocal` -- consistent with
# this runner's GUI session simply not promoting a new modal/sheet window
# from a background-role process to a visible/key state. That is a
# structural property of the runner's session type, not something fixable
# via AppleScript. Network reachability is fine (curl to
# accounts.google.com returns 302), so this isn't egress/DNS, and
# Accessibility permission is confirmed fine (see above).
#
# Conclusion: this is probably not solvable from inside a GitHub-hosted
# ephemeral macOS runner, regardless of script. If Google login needs to
# happen for real, the options are (a) a self-hosted runner on a real,
# normally-logged-in Mac you control, where a human signs in once and the
# session persists across runs, or (b) sign in manually on your own
# machine, capture whatever Yappy persists after a successful login
# (contents unknown until a successful sign-in is observed somewhere --
# likely something under ~/.yappy/ and/or Keychain), and restore that
# into each ephemeral run as a secret. Neither attempted. No credentials
# have been typed anywhere in this process.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest Yappy DMG URL
        id: yappy
        run: |
          url=$(curl -fsSL -H "User-Agent: gha-runner-gui-kit (+https://github.com/qte77/gha-runner-gui-kit)" \
            https://yappy.biz/api/v1/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['download_url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: ./
        with:
          download-url: ${{ steps.yappy.outputs.url }}
          install-type: dmg
          settle-seconds: '8'
          interact-script: |
            tell application "Yappy" to activate
            delay 1
            tell application "System Events"
              tell process "Yappy"
                click button 1 of window 1
              end tell
            end tell
            delay 9
