name: yappy-google-login-probe

# Phase B, step 1: click "Sign in with Google". example.yml's run showed
# Yappy's real first-launch screen is a mandatory Google sign-in gate
# (contradicts yappy.biz's own docs, which claim no account is needed --
# direct observation wins).
#
# CONFIRMED WORKING: the click itself. The button has no accessible name
# (empty AXTitle) -- System Events sees it only as `button 1 of window 1`,
# a direct sibling of the heading/subtitle text, not nested under the
# icon's group/scroll-area. `click button "Sign in with Google" of window 1`
# fails (-1728, no such object); `click button 1 of window 1` works.
# Accessibility permission for UI scripting is NOT an issue on macos-14
# runners -- a permissions failure gives a distinct "not allowed assistive
# access" error, and that never appeared.
#
# BLOCKED past the click: Yappy uses an embedded WebKit view for the
# Google auth flow -- com.apple.WebKit.Networking plus two
# com.apple.WebKit.WebContent processes spin up on click, confirmed via a
# full process list -- rather than the system browser. But no visible
# window or menu-bar status item ever appears afterward: `entire contents`,
# `every window`, and `every menu bar item of menu bar 2` of process
# "Yappy" all come back empty, across delays from 0.4s to ~9s post-click,
# and a probe-before.png capture at 0.4s post-click shows nothing either
# (checked network reachability too: `curl` to accounts.google.com from
# the runner returns 302, so this isn't egress/DNS).
#
# Two live hypotheses, neither confirmed:
#  1. Google's OAuth blocks sign-in from embedded (non-system-browser)
#     webviews as an anti-phishing measure ("disallowed_useragent"). If
#     that's what's happening, no amount of scripting here gets past it --
#     the fix would have to be on Yappy's side (system browser or
#     ASWebAuthenticationSession instead of a bare WKWebView).
#  2. The WebKit-hosted window specifically fails to render in this
#     runner's WindowServer session (a known category of flakiness for
#     WebKit XPC processes in CI-like macOS environments), even though
#     plain AppKit windows (the initial welcome screen) render fine.
# Distinguishing these needs either a much longer settle (untried: 20s+)
# or Console/crash-log inspection on the runner, neither done yet.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest Yappy DMG URL
        id: yappy
        run: |
          url=$(curl -fsSL -H "User-Agent: gha-runner-gui-kit (+https://github.com/qte77/gha-runner-gui-kit)" \
            https://yappy.biz/api/v1/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['download_url'])")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: ./
        with:
          download-url: ${{ steps.yappy.outputs.url }}
          install-type: dmg
          settle-seconds: '8'
          interact-script: |
            tell application "Yappy" to activate
            delay 1
            tell application "System Events"
              tell process "Yappy"
                click button 1 of window 1
              end tell
            end tell
            delay 9
